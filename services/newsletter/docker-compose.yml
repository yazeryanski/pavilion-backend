# Local RabbitMQ for the newsletter service.
# The repo has no other docker setup yet; this is here purely for local development.
# Management UI: http://localhost:15672 (guest / guest)
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: pavilion-rabbitmq
    ports:
      - '5672:5672'   # AMQP
      - '15672:15672' # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
